name: CI — Build e Validações

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Go (Lints, Testes e Cobertura)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: true

      - name: Verificar caracteres invisíveis
        env:
          LC_ALL: C.UTF-8
        run: |
          rc=0
          git grep -lP "[\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2060}-\x{2069}\x{FEFF}]" || rc=$?
          [ "$rc" -eq 1 ] || { echo "::error::Caractere invisível detectado nos arquivos."; exit 1; }

      - name: Formatação (gofmt)
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: go mod tidy
        run: go mod tidy -diff || true

      - name: go vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Testes com Detector de Race e Cobertura
        run: |
          go test ./... -race -coverprofile=cobertura.out || true
          if [ -f cobertura.out ]; then
            echo "**Cobertura de instruções (Go):** $(go tool cover -func=cobertura.out | tail -1 | awk '{print $NF}')" >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    name: Frontend (NPM, Testes e Duplicação)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências, testes e auditoria
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test || true
          npm audit || true

      - name: Verificar duplicação de código (jscpd)
        run: >
          npx --yes jscpd@5.4.0 --threshold 5 --reporters console
          --format go,typescript
          --ignore "**/*_test.go,**/*.test.ts,**/wailsjs/**,**/node_modules/**,**/dist/**"
          pkg frontend/src ./*.go || true

  gui:
    name: Build GUI Desktop (Wails / Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências GTK e WebKit no Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Instalar Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build da aplicação Wails
        run: |
          mkdir -p frontend/dist
          wails build || true
